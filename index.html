<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akuntan Otomatis – Masuk</title><link rel="stylesheet" href="pd-mitra/css/style.css"><link rel="shortcut icon" type="image/x-icon" href="favicon.ico"></head>
<body class="center"><div class="card auth"><h2>📒 Akuntan Otomatis</h2><p class="muted">Siklus akuntansi dari dokumen transaksi, otomatis.</p>
<div class="tabs"><button class="tab on" data-m="login">Masuk</button><button class="tab" data-m="register">Daftar</button></div>
<form id="f"><label>Username<input id="u" autocomplete="username" required></label>
<label>Password<input id="p" type="password" autocomplete="current-password" required></label>
<label id="pw2w" hidden>Ulangi password<input id="p2" type="password" autocomplete="new-password"></label>
<button class="btn" id="go">Masuk</button><p id="msg" class="err"></p></form></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="pd-mitra/js/config.js"></script><script src="pd-mitra/js/db.js"></script><script src="pd-mitra/js/auth.js"></script></body></html>
